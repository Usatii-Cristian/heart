<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Te iubesc Ariana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 620px;
      height: 560px;
    }

    .love_word {
      font-family: Arial, sans-serif;
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
      animation: fade-cascade linear infinite;
    }

    .center_word {
      font-family: Arial, sans-serif;
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
      animation: fade-glow 5s ease-in-out infinite;
    }

    @keyframes fade-cascade {
      0%   { opacity: 0.07; }
      30%  { opacity: 1.0;  }
      70%  { opacity: 1.0;  }
      100% { opacity: 0.07; }
    }

    @keyframes fade-glow {
      0%   { opacity: 0.2; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="container" id="heart-container"></div>

  <script>
    const container = document.getElementById('heart-container');

    function heartX(t) {
      return 16 * Math.pow(Math.sin(t), 3);
    }
    function heartY(t) {
      return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    }

    const centerX = 310;
    const centerY = 220;
    const scale = 16;

    const colors = [
      '#ff4b6e', '#ff6b8a', '#ff2255', '#ff8fa3',
      '#e8003d', '#ff3366', '#cc0044', '#ff99aa',
      '#ff1a4f', '#ff5577'
    ];

    const DURATION = 8;

    // outline - "Te iubesc" cascade
    const outlineCount = 80;
    for (let i = 0; i < outlineCount; i++) {
      const t = (i / outlineCount) * 2 * Math.PI;
      const x = centerX + heartX(t) * scale;
      const y = centerY - heartY(t) * scale;
      createOutlineWord(x, y, -((outlineCount - i) / outlineCount) * DURATION);
    }

    createCenterWord(centerX, centerY + 60);

    function createOutlineWord(x, y, delay) {
      const el = document.createElement('div');
      el.classList.add('love_word');
      el.textContent = 'Te iubesc';

      const color = colors[Math.floor(Math.random() * colors.length)];
      const size = 0.7 + Math.random() * 0.45;

      el.style.left              = (x - 32) + 'px';
      el.style.top               = (y - 9)  + 'px';
      el.style.fontSize          = size + 'rem';
      el.style.color             = color;
      el.style.textShadow        = `0 0 14px ${color}, 0 0 4px #fff`;
      el.style.fontWeight        = 'bold';
      el.style.animationDuration = DURATION + 's';
      el.style.animationDelay    = delay + 's';

      container.appendChild(el);
    }

    function createCenterWord(x, y) {
      const el = document.createElement('div');
      el.classList.add('center_word');
      el.textContent = 'Te iubesc Ariana';

      el.style.left          = '50%';
      el.style.top           = y + 'px';
      el.style.transform     = 'translateX(-50%)';
      el.style.fontSize      = '1.6rem';
      el.style.color         = '#ff4b6e';
      el.style.textShadow    = '0 0 20px #ff4b6e, 0 0 8px #fff';
      el.style.fontWeight    = 'bold';
      el.style.letterSpacing = '2px';

      container.appendChild(el);
    }
  </script>
</body>
</html>
